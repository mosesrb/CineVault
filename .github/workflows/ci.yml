name: CineVault CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v5
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install Backend Dependencies
      run: npm ci
      
    - name: Install Frontend Dependencies
      run: npm ci --prefix frontend

    - name: Audit Dependencies
      run: npm run audit

    - name: Run Static Analysis
      run: npm run lint

    - name: Run Frontend Tests (Vitest)
      run: npm test --prefix frontend

    - name: Build Frontend
      run: npm run build --prefix frontend

    - name: Run Backend Integration Tests
      env:
        NODE_ENV: test
        JWT_PRIVATE_KEY: test_key_for_ci_cd_pipeline
        MONGO_URI: mongodb://localhost:27017/cinevault_test
        REDIS_URL: redis://localhost:6379
      run: npm test

  android:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js 24
      uses: actions/setup-node@v5
      with:
        node-version: 24.x
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Use Java 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'

    - name: Install Android SDK 36
      run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

    - name: Install and build web assets
      run: |
        npm ci --prefix frontend
        npm run build --prefix frontend

    - name: Sync Capacitor Android project
      run: cd frontend && npx cap sync android

    - name: Compile debug app and validate release manifest
      working-directory: frontend/android
      run: |
        chmod +x gradlew
        ./gradlew :app:assembleDebug :app:processReleaseMainManifest --no-daemon --console=plain

    - name: Upload debug APK for device validation
      uses: actions/upload-artifact@v4
      with:
        name: cinevault-android-debug
        path: frontend/android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
        retention-days: 7
